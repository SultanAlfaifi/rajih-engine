<!doctype html>
<!--
DIRECTION: Quiet analytical publishing on a true-white field.
AUDIENCE: Hackathon teams and agent-system builders evaluating RAJIH.
SIGNATURE: Three independent idea paths converge through evidence into one decision.
CONTENT: Product truth only; no performance, novelty, or validation claims.
MOTION: A single optional convergence reveal, disabled for reduced-motion users.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAJIH Engine — Project Card</title>
  <style>
    :root {
      --paper: #fff;
      --ink: #14201c;
      --muted: #66716d;
      --line: #dde5e1;
      --emerald: #0b7a53;
      --pale: #eaf5f0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #eef2f0;
      color: var(--ink);
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .card {
      position: relative;
      width: min(1200px, 100%);
      aspect-ratio: 1200 / 630;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 24px 70px rgba(20, 32, 28, .12);
      display: grid;
      grid-template-columns: 56% 44%;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(11, 122, 83, .12);
      pointer-events: none;
    }

    .copy {
      padding: 72px 36px 48px 76px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--emerald);
      font-size: 14px;
      font-weight: 720;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border: 1px solid var(--emerald);
      border-radius: 50%;
    }

    .brand-mark svg { width: 19px; height: 19px; }

    h1 {
      margin: 50px 0 0;
      max-width: 620px;
      font-family: "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(56px, 7.8vw, 104px);
      font-weight: 500;
      line-height: .82;
      letter-spacing: -.04em;
    }

    .descriptor {
      display: block;
      margin-top: 20px;
      color: var(--emerald);
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .statement {
      max-width: 560px;
      margin: 28px 0 0;
      font-size: clamp(19px, 2.1vw, 28px);
      line-height: 1.38;
      letter-spacing: -.02em;
      text-wrap: balance;
    }

    .statement strong { color: var(--emerald); font-weight: 650; }

    .footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 15px;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font-weight: 650;
    }

    .visual {
      position: relative;
      display: grid;
      place-items: center;
      padding: 54px 60px 54px 18px;
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 80px 58px 80px 0;
      background: var(--pale);
      border-radius: 50% 42% 46% 54% / 44% 54% 46% 56%;
      transform: rotate(-5deg);
    }

    .system {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
    }

    .system svg { display: block; width: 100%; height: auto; overflow: visible; }

    .path {
      fill: none;
      stroke: #7f958c;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 360;
      animation: reveal 1.2s cubic-bezier(.16, 1, .3, 1) both;
    }

    .path:nth-of-type(2) { animation-delay: .12s; }
    .path:nth-of-type(3) { animation-delay: .24s; }
    .path.selected { stroke: var(--emerald); stroke-width: 2.5; animation-delay: .48s; }

    .node { fill: var(--paper); stroke: #7f958c; stroke-width: 1.5; }
    .node-final { fill: var(--emerald); stroke: var(--emerald); }
    .node-evidence { fill: var(--pale); stroke: var(--emerald); stroke-width: 1.5; }

    .label {
      fill: var(--muted);
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .13em;
    }

    .label.final { fill: var(--emerald); }

    @keyframes reveal {
      from { stroke-dashoffset: 360; opacity: .2; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .path { animation: none; }
    }

    @media (max-width: 760px) {
      body { padding: 14px; }
      .card {
        aspect-ratio: auto;
        min-height: 720px;
        grid-template-columns: 1fr;
      }
      .copy { padding: 52px 38px 24px; }
      h1 { margin-top: 40px; font-size: 70px; }
      .visual { min-height: 310px; padding: 10px 52px 52px; }
      .visual::before { inset: 10px 42px 42px; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="RAJIH Engine project card">
    <section class="copy">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 6.5h5.5L12 10l2.5-3.5H20M4 17.5h5.5L12 14l2.5 3.5H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Evidence-grounded ideation
      </div>

      <h1>RAJIH<span class="descriptor">Engine</span></h1>

      <p class="statement">
        Independent ideas. Structured critique.<br>
        Evidence-informed selection—with a <strong>human at the consequential edge.</strong>
      </p>

      <div class="footer">
        <span class="status">Engineering beta</span>
        <span>github.com/SultanAlfaifi/rajih-engine</span>
      </div>
    </section>

    <section class="visual" aria-label="Independent ideation paths converging through evidence">
      <div class="system">
        <svg viewBox="0 0 440 450" role="img" aria-labelledby="diagram-title diagram-desc">
          <title id="diagram-title">RAJIH convergence model</title>
          <desc id="diagram-desc">Three isolated idea paths are challenged, supported by evidence, and converge on a human-aware decision.</desc>

          <path class="path" d="M62 88 C160 88 128 178 215 203"/>
          <path class="path" d="M62 225 C145 225 155 225 215 225"/>
          <path class="path" d="M62 362 C160 362 128 272 215 247"/>
          <path class="path selected" d="M242 225 C312 225 313 225 374 225"/>

          <circle class="node" cx="50" cy="88" r="12"/>
          <circle class="node" cx="50" cy="225" r="12"/>
          <circle class="node" cx="50" cy="362" r="12"/>
          <circle class="node-evidence" cx="228" cy="225" r="23"/>
          <circle class="node-final" cx="390" cy="225" r="18"/>
          <circle cx="390" cy="225" r="6" fill="#fff"/>

          <text class="label" x="28" y="61">GROUNDED</text>
          <text class="label" x="8" y="198">TRANSFORM</text>
          <text class="label" x="20" y="398">DEMO-FIRST</text>
          <text class="label" x="197" y="184">EVIDENCE</text>
          <text class="label final" x="357" y="267">DECISION</text>

          <g transform="translate(217 214)" stroke="#0b7a53" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M0 8l7 7 15-18"/>
          </g>
        </svg>
      </div>
    </section>
  </main>
</body>
</html>

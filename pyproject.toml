[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rajih"
version = "0.2.0"
description = "Evidence-grounded, cost-aware multi-agent ideation for hackathons."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Copyright Holder (set in NOTICE.md)" }]
keywords = ["multi-agent", "ideation", "hackathon", "orchestration", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: Other/Proprietary License",
]

[project.scripts]
rajih = "rajih.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

